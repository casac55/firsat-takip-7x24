services:
  firsat-takip:
    build: .
    container_name: firsat-takip-7x24
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Europe/Istanbul
      - DASHBOARD_HOST=0.0.0.0
    ports:
      - "8050:8050"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml
      - ./.env:/app/.env
